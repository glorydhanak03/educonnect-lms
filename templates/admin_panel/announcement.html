{% extends "admin_panel/base_admin.html" %}

{% block admin_title %}Admin | Announcement{% endblock %}

{% block admin_content %}
<style>
/* === Existing CSS + Modal / JS styling merged === */
.page-wrapper{
    background:#e9f0f8;
    padding:25px;
    border-radius:10px;
}
.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}
.page-header h2{
    font-size:24px;
    font-weight:600;
}
.controls{
    display:flex;
    gap:10px;
}
.controls input,
.controls select{
    padding:8px 12px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:14px;
}
.send-btn{
    background:#6c63ff;
    color:#fff;
    padding:8px 14px;
    border-radius:6px;
    text-decoration:none;
    font-size:14px;
}
.section-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}
.category-box{
    background:#fff;
    border-radius:12px;
    padding:20px;
    position:relative;
    box-shadow:0 3px 8px rgba(0,0,0,0.08);
}
.category-box::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:6px;
    background:#ff4d4d;
    border-top-left-radius:12px;
    border-bottom-left-radius:12px;
}
.category-title{
    font-size:18px;
    font-weight:600;
    margin-bottom:15px;
}
.announcement-item{
    background:#fde2e2;
    padding:12px;
    border-radius:8px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}
.announcement-item h5{
    margin:0;
    font-size:15px;
    font-weight:600;
}
.announcement-item p{
    margin:4px 0;
    font-size:13px;
}
.meta{
    font-size:12px;
    color:#555;
}
.open-modal-btn{
    background:#007bff;
    color:white;
    padding:8px 14px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
.modal-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}
.modal-box{
    background:#fff;
    width:500px;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
}
.modal-box h2{
    margin-bottom:15px;
}
.modal-box input,
.modal-box select,
.modal-box textarea{
    width:100%;
    padding:10px;
    margin-bottom:12px;
    border-radius:8px;
    border:1px solid #ccc;
}
.modal-box textarea{
    height:100px;
    resize:none;
}
.modal-buttons{
    display:flex;
    gap:10px;
}
.submit-btn{
    background:blue;
    color:white;
    padding:8px 16px;
    border:none;
    border-radius:6px;
}
.cancel-btn{
    background:red;
    color:white;
    padding:8px 16px;
    border:none;
    border-radius:6px;
}
.action-icons span{
    cursor:pointer;
    margin-left:8px;
}
.toast{
    position:fixed;
    top:20px;
    right:20px;
    background:#28a745;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    box-shadow:0 3px 8px rgba(0,0,0,0.2);
}
</style>

<div class="page-wrapper">
    <div class="page-header">
        <h2>🔔 Announcement & Notifications</h2>
        <div class="controls">
            <input type="text" id="searchBox" placeholder="Search...">
            <select id="filterCategory">
                <option value="All">All Categories</option>
                <option value="Students">Students</option>
                <option value="Faculty">Faculty</option>
                <option value="Parents">Parents</option>
                <option value="Exams">Exams</option>
                <option value="Payments">Payments</option>
                <option value="Results">Results</option>
            </select>
            <button class="open-modal-btn" onclick="openModal()">Send Announcement & Notifications</button>
        </div>
    </div>

    <div class="section-grid" id="announcementGrid">
        <!-- JS renders announcements -->
    </div>
</div>

<!-- Modal -->
<div id="announcementModal" class="modal-overlay">
    <div class="modal-box">
        <h2 id="modalTitle">Add Announcement</h2>

        <input type="text" id="title" placeholder="Enter Title">
        <input type="text" value="Admin" disabled>
        <label>Select Categories (multi-select)</label>
        <select id="audience" multiple>
            <option value="Students">Students</option>
            <option value="Faculty">Faculty</option>
            <option value="Parents">Parents</option>
            <option value="Exams">Exams</option>
            <option value="Payments">Payments</option>
            <option value="Results">Results</option>
        </select>
        <textarea id="message" placeholder="Enter description..."></textarea>

        <div class="modal-buttons">
            <button type="button" class="submit-btn" onclick="submitAnnouncement()">Submit</button>
            <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<div id="toast" class="toast" style="display:none;">Done! 🎉</div>

<script>
// === State ===
let announcements = {Students:[], Faculty:[], Parents:[], Exams:[], Payments:[], Results:[]};
let editInfo = null;

// === Modal Functions ===
function openModal(){document.getElementById("announcementModal").style.display="flex";}
function closeModal(){document.getElementById("announcementModal").style.display="none"; clearModalForm();}
function clearModalForm(){document.getElementById("title").value="";document.getElementById("message").value=""; const select=document.getElementById("audience"); for(let i=0;i<select.options.length;i++) select.options[i].selected=false; editInfo=null; document.getElementById("modalTitle").innerText="Add Announcement";}

// === Add/Edit Announcement ===
function submitAnnouncement(){
    const title=document.getElementById("title").value.trim();
    const message=document.getElementById("message").value.trim();
    const categories=Array.from(document.getElementById("audience").selectedOptions).map(o=>o.value);
    const sender="Admin";
    const timestamp=new Date().toLocaleString();
    if(!title||!message||categories.length===0){alert("Fill all fields and select at least one category"); return;}
    const item={title,message,sender,timestamp};
    if(editInfo){
        const {cat,index}=editInfo;
        announcements[cat][index]=item;
        categories.forEach(c=>{if(!announcements[c].includes(item)) announcements[c].push(item);});
        editInfo=null;
    } else {categories.forEach(cat=>announcements[cat].push({...item}));}
    showToast();
    closeModal();
    renderAnnouncements();
}

// === Delete/Edit ===
function deleteAnnouncement(cat,index){if(!confirm(`Delete this announcement from ${cat}?`)) return; announcements[cat].splice(index,1); renderAnnouncements();}
function editAnnouncement(cat,index){const item=announcements[cat][index]; document.getElementById("title").value=item.title; document.getElementById("message").value=item.message; const select=document.getElementById("audience"); for(let i=0;i<select.options.length;i++){select.options[i].selected = itemCategoryExists(select.options[i].value,cat);} editInfo={cat,index}; document.getElementById("modalTitle").innerText="Edit Announcement"; openModal();}
function itemCategoryExists(optionValue,cat){return optionValue===cat;}

// === Render Announcements ===
function renderAnnouncements(){
    const grid=document.getElementById("announcementGrid");
    grid.innerHTML="";
    const filterCat=document.getElementById("filterCategory").value;
    const search=document.getElementById("searchBox").value.toLowerCase();
    for(let cat in announcements){
        if(filterCat!=="All"&&filterCat!==cat) continue;
        const items=announcements[cat].filter(a=>a.title.toLowerCase().includes(search)||a.message.toLowerCase().includes(search));
        const box=document.createElement("div"); box.className="category-box";
        const titleDiv=document.createElement("div"); titleDiv.className="category-title"; titleDiv.innerText=cat; box.appendChild(titleDiv);
        if(items.length===0){ const p=document.createElement("p"); p.innerText="No Announcements"; box.appendChild(p);}
        items.forEach((a,i)=>{const itemDiv=document.createElement("div"); itemDiv.className="announcement-item";
        itemDiv.innerHTML=`<div>
            <h5>${a.title}</h5>
            <p>${a.message}</p>
            <div class="meta">By: ${a.sender} | ${a.timestamp}</div>
        </div>
        <div class="action-icons">
            <span onclick="editAnnouncement('${cat}',${i})" title="Edit">✏️</span>
            <span onclick="deleteAnnouncement('${cat}',${i})" title="Delete">🗑️</span>
        </div>`; box.appendChild(itemDiv);});
        grid.appendChild(box);
    }
}

// === Toast ===
function showToast(){const t=document.getElementById("toast"); t.style.display="block"; setTimeout(()=>{t.style.display="none";},2000);}

// === Search/Filter ===
document.getElementById("searchBox").addEventListener("input",renderAnnouncements);
document.getElementById("filterCategory").addEventListener("change",renderAnnouncements);

// === Initial Render ===
renderAnnouncements();
</script>

{% endblock %}
